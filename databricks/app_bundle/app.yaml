# Databricks App definition for CAS (FastAPI backend + Streamlit UI).
#
# databricks/09_deploy_app.py stage() copies this to the ROOT of the deployed
# folder: Apps read app.yaml only from there, and a source folder cannot see files
# outside itself, so it cannot stay in databricks/ (docs: .../databricks-apps/app-runtime,
# .../databricks-apps/deploy).
#
# COST: the App bills while RUNNING (Medium = 0.5 DBU/h, .../databricks-apps/compute-size)
# and needs the Vector Search index up (~4 DBU/h). 09 app_stop() + 02 pause() after a demo.
# 09 stage() refuses to ship this file if a value below disagrees with the notebook.
#
# Deliberately NOT set here:
# - DATABRICKS_TOKEN / DATABRICKS_HOST / OPENAI_API_KEY: the platform injects the
#   app's service principal (DATABRICKS_CLIENT_ID/SECRET); a DATABRICKS_TOKEN next
#   to them is a conflicting auth method and breaks every SDK call
#   (.../dev-tools/auth/oauth-m2m). OPENAI_AUTH=databricks mints LLM tokens from it.
# - OPENAI_BASE_URL: run_app.py derives it from the injected DATABRICKS_HOST +
#   OPENAI_BASE_PATH, so the workspace URL is never hard-coded (app.yaml values are not
#   shell-expanded). The embeddings take the same host (vector_search.gateway_url).
#
# Unity Gateway (2026-11-13): the workspace has "Enforce Unity Gateway" on, which
# disables the databricks-* pay-per-token endpoints. Both models are reached as model
# services (system.ai.*) at <host>/ai-gateway/mlflow/v1. REVERT (enforcement off):
# OPENAI_MODEL "databricks-qwen3-next-80b-a3b-instruct", VS_EMBEDDING_SERVICE "",
# OPENAI_BASE_PATH "/serving-endpoints" (and the same in notebook Cell 2).
command: ["python", "run_app.py"]
env:
  - name: SEARCH_BACKEND
    value: "databricks"
  - name: CAS_CATALOG
    value: "dev"
  - name: CAS_SCHEMA
    value: "cas"
  - name: VS_EMBEDDING_MODEL
    value: "databricks-gte-large-en"   # LABEL of the vectors 02 embedded the catalog with
  - name: VS_EMBEDDING_SERVICE
    value: "system.ai.gte-large-en"    # what the App calls: the same model via Unity Gateway
  - name: VS_INDEX
    value: "dev.cas.products_index"    # the index 09 app_grant() grants SELECT on
  - name: VS_QUERY_MODE
    value: "vector"
  # Written by 09 export_catalog() from dev.cas.products, WITH its catalog_index
  - name: VS_CATALOG_CSV
    value: "/Volumes/dev/cas/raw/app_catalog.csv"
  - name: LLM_PROVIDER
    value: "openai"                    # the PROTOCOL; the endpoint is Databricks-hosted
  - name: OPENAI_MODEL
    value: "system.ai.qwen3-next-80b-a3b-instruct"
  - name: OPENAI_BASE_PATH
    value: "/ai-gateway/mlflow/v1"
  - name: OPENAI_AUTH
    value: "databricks"
  - name: TRANSLATOR_MODE
    value: "query_expansion"
  # The config default, set explicitly because it is UNCALIBRATED for this index:
  # 07 measured 0.638 on the old managed index (keyword set, gpt-oss intents only)
  - name: MIN_RESULT_RELEVANCE
    value: "0.5"
  # Tracing a shared deployment needs a trace-storage decision first (CLAUDE.md)
  - name: MLFLOW_ENABLED
    value: "false"
  # Persistent memo of ACCEPTED LLM replies: the same search gives the same results
  # (2026-10-27). The App's own disk is wiped on every restart, so the memo lives on
  # the UC Volume 09 app_create() / app_grant() create and grant (READ + WRITE VOLUME);
  # 09 stage() refuses any other LLM_MEMO_DIR. Each new search reads and writes the
  # volume through the Files API (latency unmeasured on the App). REVERT: "false"
  # (repeats then re-sample; 09 then neither creates nor grants the volume).
  - name: LLM_MEMO
    value: "true"
  - name: LLM_MEMO_DIR
    value: "/Volumes/dev/cas/app_state/llm_memo"
  - name: BACKEND_URL
    value: "http://127.0.0.1:8001"
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
